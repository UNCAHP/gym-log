<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.png">
<title>Gym Log</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111418;color:#e8ecf1;font:17px/1.35 system-ui,-apple-system,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;background:#111418;z-index:5;padding:10px 12px 6px;border-bottom:1px solid #222831}
.row{display:flex;gap:8px;align-items:center}.seg{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;background:#232a33;border:0;border-radius:12px;padding:12px 14px;min-height:48px;cursor:pointer}
button.on{background:#2f7cf6;color:#fff;font-weight:700}button.go{background:#1fbf6a;color:#06210f;font-weight:800}
.tabs button{flex:1}.days button{flex:1;padding:10px 4px;font-size:15px}
main{padding:12px}.card{background:#1a1f26;border-radius:16px;padding:12px;margin-bottom:12px}
h2{margin:0 0 4px;font-size:19px}.muted{color:#8b97a6;font-size:14px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:6px;align-items:center;margin-top:8px}
.step{display:flex;align-items:center;background:#232a33;border-radius:12px}.step button{min-width:44px;padding:8px 0;background:#2b333e;font-size:22px}
.step input{width:100%;min-width:0;background:transparent;border:0;color:#fff;text-align:center;font:700 20px system-ui}
.tick{font-size:22px}.tick.on{background:#1fbf6a;color:#06210f}
input.note,select{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid #2b333e;background:#111418;color:#e8ecf1;font:inherit}
.bar{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#111418;border-top:1px solid #222831}
.bar button{width:100%;font-size:19px}table{width:100%;border-collapse:collapse;font-size:15px}td{padding:5px 2px;border-top:1px solid #262d36}
svg{width:100%;height:auto;display:block}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1fbf6a;color:#06210f;padding:10px 16px;border-radius:12px;font-weight:700;display:none;z-index:9}
</style></head><body>
<header><div class="row seg" id="people"></div><div class="row seg tabs" style="margin-top:8px" id="tabs"></div><div class="row seg days" style="margin-top:8px" id="days"></div></header>

let cfg=JSON.parse(localStorage.getItem(K+'.cfg')||'{"url":"","key":"","pending":[],"last":null}');
const saveCfg=()=>localStorage.setItem(K+'.cfg',JSON.stringify(cfg));
(()=>{const m=location.hash.match(/#setup=([^&]+)/);if(!m)return;try{const o=JSON.parse(atob(decodeURIComponent(m[1]).replace(/-/g,'+').replace(/_/g,'/')));if(o.url&&o.key){cfg.url=o.url;cfg.key=o.key;saveCfg();setTimeout(()=>toast('Sync set up ✓'),300)}}catch(e){alert('Bad setup link')}history.replaceState(null,'',location.pathname+location.search)})();
let st=JSON.parse(localStorage.getItem(K+'.ui')||'{"person":"Reg","tab":"log","day":1}'),draft=null;
const sk=s=>s.date?1e7+Date.parse(s.date)/1e5:s.order;
function store(){localStorage.setItem(K,JSON.stringify(db))}
function ui(){localStorage.setItem(K+'.ui',JSON.stringify(st))}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mine=()=>db.sessions.filter(s=>s.person===st.person);
const label=s=>s.date?new Date(s.date).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):s.label;
function last(day,name){const ss=mine().filter(s=>s.day==day).sort((a,b)=>sk(b)-sk(a));for(const s of ss){const e=(s.exercises||[]).find(e=>e.name===name);if(e&&e.sets.length)return {e,s}}return null}
function newDraft(){const d=DAYS[st.day];draft={day:st.day,note:'',exercises:[]};
 if(d.cardio){const p=mine().filter(s=>s.day==3).sort((a,b)=>sk(b)-sk(a))[0];draft.cardio=p?.cardio?{...p.cardio}:{option:'Sprint 30s / walk 90s',minutes:20,rounds:10};return}
 if(d.circuit)draft.rounds=(mine().filter(s=>s.day==5).sort((a,b)=>sk(b)-sk(a))[0]?.rounds)||3;
 for(const[n,sets,reps]of d.ex){const L=last(st.day,n),cnt=Math.max(sets,L?L.e.sets.length:0);
  draft.exercises.push({name:n,target:reps,sets:Array.from({length:cnt},(_,i)=>{const p=L?.e.sets[i]||L?.e.sets[L.e.sets.length-1];return{w:p?.w??0,r:p?.r??(parseInt(reps)||10),done:false}}),note:L?.e.note||'',lastLbl:L?label(L.s):null,prev:L?L.e.sets.map(x=>x.w+'×'+(x.r??'?')).join(', '):'—'})}}
function render(){
 $('people').innerHTML=['Gina','Reg'].map(p=>`<button style="flex:1" class="${p===st.person?'on':''}" onclick="setP('${p}')">${p}</button>`).join('');
 $('tabs').innerHTML=[['log','Log'],['hist','History']].map(([k,t])=>`<button class="${k===st.tab?'on':''}" onclick="setT('${k}')">${t}</button>`).join('')+`<button onclick="setT('data')" class="${st.tab==='data'?'on':''}">⋯</button>`;
 $('days').innerHTML=Object.entries(DAYS).map(([k,d])=>`<button class="${k==st.day?'on':''}" onclick="setD(${k})">${k}<br><small>${d.name}</small></button>`).join('');
 $('days').style.display=st.tab==='data'?'none':'flex';$('bar').style.display=st.tab==='log'?'block':'none';
 st.tab==='log'?renderLog():st.tab==='hist'?renderHist():renderData()}
function renderLog(){if(!draft||draft.day!=st.day||draft.person!==st.person){newDraft();draft.person=st.person}const d=DAYS[st.day];let h=`<div class="muted" style="margin-bottom:8px">${st.person} · Day ${st.day} ${d.name} · today ${new Date().toLocaleDateString('en-GB')}</div>`;
 if(d.cardio){const c=draft.cardio;h+=`<div class="card"><h2>Cardio</h2><select onchange="draft.cardio.option=this.value">${['Sprint 30s / walk 90s','Incline walk','Other'].map(o=>`<option ${o===c.option?'selected':''}>${o}</option>`).join('')}</select>
 <div class="set" style="grid-template-columns:1fr 1fr"><div><div class="muted">Minutes</div>${stepper('cardio.minutes',c.minutes,5)}</div><div><div class="muted">Rounds</div>${stepper('cardio.rounds',c.rounds,1)}</div></div>
 <input class="note" placeholder="Note (speed, incline…)" value="${esc(draft.note)}" oninput="draft.note=this.value"></div>`}
 else{if(d.circuit)h+=`<div class="card"><h2>Circuit rounds</h2><div class="muted">Repeat 3–4 rounds</div>${stepper('rounds',draft.rounds,1)}</div>`;
 draft.exercises.forEach((e,i)=>{h+=`<div class="card"><h2>${esc(e.name)}</h2><div class="muted">Target ${e.sets.length}×${esc(e.target)} · Last${e.lastLbl?' ('+esc(e.lastLbl)+')':''}: ${esc(e.prev)}</div>
 <div class="set muted" style="margin-top:6px"><span>#</span><span style="text-align:center">kg</span><span style="text-align:center">reps</span><span></span></div>`+
 e.sets.map((s,j)=>`<div class="set"><b>${j+1}</b>${stepper(`exercises.${i}.sets.${j}.w`,s.w,2.5)}${stepper(`exercises.${i}.sets.${j}.r`,s.r,1)}<button class="tick ${s.done?'on':''}" onclick="tick(${i},${j})">✓</button></div>`).join('')+
 `<div class="row" style="margin-top:8px"><button style="flex:1" onclick="addSet(${i},1)">+ set</button><button style="flex:1" onclick="addSet(${i},-1)">− set</button></div>
 <input class="note" placeholder="Note (machine, grip…)" value="${esc(e.note)}" oninput="draft.exercises[${i}].note=this.value"></div>`})}
 $('main').innerHTML=h}
function stepper(path,v,step){return `<div class="step"><button onclick="bump('${path}',-${step})">−</button><input inputmode="decimal" value="${v??''}" onchange="setv('${path}',this.value)"><button onclick="bump('${path}',${step})">+</button></div>`}
function ref(path){const p=path.split('.');let o=draft;for(let i=0;i<p.length-1;i++)o=o[p[i]];return[o,p.at(-1)]}
function bump(path,d){const[o,k]=ref(path);o[k]=Math.max(0,Math.round(((+o[k]||0)+d)*100)/100);renderLog()}
function setv(path,v){const[o,k]=ref(path);o[k]=v===''?null:+v}
function tick(i,j){const s=draft.exercises[i].sets[j];s.done=!s.done;renderLog()}
function addSet(i,d){const ss=draft.exercises[i].sets;if(d>0)ss.push({...ss.at(-1)||{w:0,r:10},done:false});else if(ss.length>1)ss.pop();renderLog()}
function save(){const d=DAYS[st.day],order=Math.max(0,...db.sessions.filter(s=>s.person===st.person&&s.day==st.day).map(s=>s.order))+1;
 const s={id:Date.now().toString(36),person:st.person,day:+st.day,date:new Date().toISOString(),order,note:draft.note||''};
 if(d.cardio)s.cardio={...draft.cardio};else{if(d.circuit)s.rounds=draft.rounds;
  s.exercises=draft.exercises.map(e=>({name:e.name,note:e.note,sets:e.sets.filter(x=>x.done).map(x=>({w:x.w,r:x.r}))})).filter(e=>e.sets.length);
  if(!s.exercises.length&&!confirm('No sets ticked. Save anyway with all sets?'))return;
  if(!s.exercises.length)s.exercises=draft.exercises.map(e=>({name:e.name,note:e.note,sets:e.sets.map(x=>({w:x.w,r:x.r}))}))}
 s.updated=Date.now();db.sessions.push(s);queue(s.id);store();sync();draft=null;toast('Saved ✓');st.tab='hist';ui();render()}
function queue(id){if(!cfg.pending.includes(id))cfg.pending.push(id);saveCfg()}
let syncing=false;
async function sync(manual){if(!cfg.url||syncing){if(manual)toast(cfg.url?'Sync busy':'Set Sheet URL first');return}if(!navigator.onLine){if(manual)toast('Offline – queued');return}
 syncing=true;try{const send=db.sessions.filter(s=>cfg.pending.includes(s.id));
  if(send.length){const r=await(await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.key,sessions:send})})).json();if(!r.ok)throw r.error;cfg.pending=cfg.pending.filter(id=>!send.some(s=>s.id===id))}
  const r=await(await fetch(cfg.url+(cfg.url.includes('?')?'&':'?')+'key='+encodeURIComponent(cfg.key))).json();if(!r.ok)throw r.error;
  const map=new Map(db.sessions.map(s=>[s.id,s]));for(const s of r.sessions){const l=map.get(s.id);if(!l||(!cfg.pending.includes(s.id)&&(s.updated||0)>=(l.updated||0)))map.set(s.id,s)}
  db.sessions=[...map.values()];store();cfg.last=new Date().toISOString();cfg.err='';saveCfg();if(manual)toast('Synced ✓');if(st.tab!=='log')render()}
 catch(e){cfg.err=String(e);saveCfg();if(manual)toast('Sync failed: '+e)}finally{syncing=false}}
window.addEventListener('online',()=>sync());
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}
function chart(pts){if(pts.length<2)return'';const W=320,H=120,P=24,mn=Math.min(...pts),mx=Math.max(...pts),rg=mx-mn||1;
 const xy=pts.map((v,i)=>[P+i*(W-2*P)/(pts.length-1),H-P-(v-mn)/rg*(H-2*P)]);
 return `<svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="#2f7cf6" stroke-width="3" points="${xy.map(p=>p.join(',')).join(' ')}"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#7fb0ff"/>`).join('')}
 <text x="2" y="${P}" fill="#8b97a6" font-size="11">${mx}</text><text x="2" y="${H-P+4}" fill="#8b97a6" font-size="11">${mn}</text></svg>`}
function renderHist(){const ss=mine().filter(s=>s.day==st.day).sort((a,b)=>sk(a)-sk(b));const d=DAYS[st.day];let h=`<div class="muted" style="margin-bottom:8px">${st.person} · Day ${st.day} ${d.name} · ${ss.length} sessions</div>`;
 if(d.cardio){h+=ss.length?`<div class="card"><table>${ss.slice().reverse().map(s=>`<tr><td>${esc(label(s))}</td><td>${esc(s.cardio.option)}</td><td>${s.cardio.minutes} min</td></tr>`).join('')}</table></div>`:'<div class="card muted">No cardio logged yet.</div>'}
 else for(const[n]of d.ex){const rows=ss.map(s=>({s,e:(s.exercises||[]).find(e=>e.name===n)})).filter(x=>x.e&&x.e.sets.length);if(!rows.length)continue;
  const top=rows.map(x=>Math.max(...x.e.sets.map(z=>+z.w||0))),bw=top.every(v=>v===0);
  h+=`<div class="card"><h2>${esc(n)}</h2><div class="muted">${bw?'Reps per set':'Top set (kg)'} · best ${bw?Math.max(...rows.flatMap(x=>x.e.sets.map(z=>z.r||0))):Math.max(...top)}</div>${chart(bw?rows.map(x=>x.e.sets.reduce((a,z)=>a+(z.r||0),0)):top)}
  <table>${rows.slice().reverse().map(x=>`<tr><td>${esc(label(x.s))}</td><td>${x.e.sets.map(z=>z.w+'×'+(z.r??'?')).join(', ')}</td></tr>`).join('')}</table></div>`}
 $('main').innerHTML=h}
function renderData(){$('main').innerHTML=`<div class="card"><h2>Data</h2><div class="muted">${db.sessions.length} sessions on this device · ${cfg.pending.length} waiting to sync · last sync ${cfg.last?new Date(cfg.last).toLocaleString('en-GB'):'never'}${cfg.err?' · error: '+esc(cfg.err):''}</div>
 <input class="note" id="surl" placeholder="Google Apps Script web app URL (…/exec)" value="${esc(cfg.url)}"><input class="note" id="skey" placeholder="Shared key" value="${esc(cfg.key)}">
 <div class="seg" style="margin-top:8px"><button class="go" onclick="cfg.url=$('surl').value.trim();cfg.key=$('skey').value.trim();saveCfg();sync(true)">Save & sync now</button><button onclick="if(confirm('Upload ALL local sessions to the Sheet?')){db.sessions.forEach(s=>queue(s.id));sync(true)}">Push all</button></div>
 <div class="seg" style="margin-top:10px"><button onclick="expJSON()">Export JSON</button><button onclick="expCSV()">Export CSV</button><button onclick="$('imp').click()">Import JSON</button>
 <input type="file" id="imp" accept=".json" hidden onchange="impJSON(this.files[0])"><button onclick="if(confirm('Reset to imported spreadsheet data? Your new sessions will be lost.')){db={sessions:SEED};store();render()}">Reset</button></div></div>`}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function expJSON(){dl('gymlog-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,1),'application/json')}
function expCSV(){const q=v=>`"${String(v??'').replace(/"/g,'""')}"`,L=[['person','date','session','day','exercise','set','reps','weight_kg','note'].join(',')];
 for(const s of db.sessions){const dt=s.date?s.date.slice(0,10):s.label;if(s.cardio)L.push([s.person,dt,s.order,s.day,'Cardio: '+s.cardio.option,'',s.cardio.rounds,'',s.cardio.minutes+' min '+(s.note||'')].map(q).join(','));
  for(const e of s.exercises||[])e.sets.forEach((z,i)=>L.push([s.person,dt,s.order,s.day,e.name,i+1,z.r,z.w,e.note].map(q).join(',')))}
 dl('gymlog.csv',L.join('\n'),'text/csv')}
function impJSON(f){f.text().then(t=>{const x=JSON.parse(t);if(!Array.isArray(x.sessions))throw 0;const ids=new Set(db.sessions.map(s=>s.id));x.sessions.forEach(s=>{if(!ids.has(s.id)){db.sessions.push(s);queue(s.id)}});store();toast('Imported (merged)');render()}).catch(()=>alert('Not a valid gym log JSON'))}
function setP(p){st.person=p;draft=null;ui();render()}function setT(t){st.tab=t;ui();render()}function setD(d){st.day=d;draft=null;ui();render()}
$('save').onclick=save;render();sync();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script></body></html>
